[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "mediasift"
version = "0.2.0"
description = "Desktop app for reviewing and safely exporting media"
requires-python = ">=3.10,<3.16"
dependencies = ["Pillow==12.3.0", "PySide6-Essentials==6.12.0", "PySide6-Addons==6.12.0", "pypdfium2==5.14.0"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]
test = ["pytest>=8,<9"]

[project.gui-scripts]
mediasift = "mediasift.ui:main"

[tool.setuptools.packages.find]
include = ["mediasift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
